<style>

/* Herramienta interna: barra superior con rol y navegación, contenido en una columna de hasta 1120px; tickets como filas, detalle con panel de acción lateral */
:root {
  --bg: #f3f6f7; --surface: #ffffff; --surface-2: #eaf0f2; --fg: #15222a; --muted: #586973; --line: #d6e0e5;
  --accent: #0a6a86; --accent-ink: #ffffff; --accent-soft: #dcedf3;
  --st-rec-bg: #e4eaf8; --st-rec-fg: #2f4c8f;
  --st-dev-bg: #fbedd2; --st-dev-fg: #7d5200;
  --st-ana-bg: #ece5f8; --st-ana-fg: #553a99;
  --st-cer-bg: #dcf0e4; --st-cer-fg: #1f6943;
  --st-rej-bg: #f8e0de; --st-rej-fg: #9a2f2a;
  --danger: #b3261e;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e161b; --surface: #152129; --surface-2: #1c2b33; --fg: #e2eaee; --muted: #93a6b0; --line: #2a3c46;
  --accent: #52b8d6; --accent-ink: #062330; --accent-soft: #15384a;
  --st-rec-bg: #1e2a47; --st-rec-fg: #a9bdf0; --st-dev-bg: #3a2c0f; --st-dev-fg: #f0c97a;
  --st-ana-bg: #2c2347; --st-ana-fg: #c8b6f2; --st-cer-bg: #143424; --st-cer-fg: #93d8b0;
  --st-rej-bg: #3d1d1b; --st-rej-fg: #f1a8a2; --danger: #f08a82; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e161b; --surface: #152129; --surface-2: #1c2b33; --fg: #e2eaee; --muted: #93a6b0; --line: #2a3c46;
  --accent: #52b8d6; --accent-ink: #062330; --accent-soft: #15384a;
  --st-rec-bg: #1e2a47; --st-rec-fg: #a9bdf0; --st-dev-bg: #3a2c0f; --st-dev-fg: #f0c97a;
  --st-ana-bg: #2c2347; --st-ana-fg: #c8b6f2; --st-cer-bg: #143424; --st-cer-fg: #93d8b0;
  --st-rej-bg: #3d1d1b; --st-rej-fg: #f1a8a2; --danger: #f08a82; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
.mono { font-family: var(--f-mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px; }
.brand { display: flex; flex-direction: column; margin-right: auto; }
.brand b { font-family: var(--f-display); font-size: 1.05rem; font-weight: 650; }
.brand span { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.85rem; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button { border: 0; background: none; font: inherit; color: var(--muted); padding: 10px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button.on { color: var(--fg); border-color: var(--accent); font-weight: 600; }
.bell { position: relative; }
.badge { background: var(--danger); color: #fff; font-size: 0.7rem; border-radius: 9px; padding: 0 6px; margin-left: 6px; font-weight: 600; }
.proto { background: var(--accent-soft); color: var(--fg); font-size: 0.82rem; padding-block: 8px; }
main { padding-block: 24px 64px; display: grid; gap: 20px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.dan { color: var(--danger); }
.btn.sm { padding: 4px 10px; font-size: 0.85rem; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
.st-Recibido { background: var(--st-rec-bg); color: var(--st-rec-fg); }
.st-Devuelto { background: var(--st-dev-bg); color: var(--st-dev-fg); }
.st-En-análisis { background: var(--st-ana-bg); color: var(--st-ana-fg); }
.st-Cerrado { background: var(--st-cer-bg); color: var(--st-cer-fg); }
.st-Rechazado { background: var(--st-rej-bg); color: var(--st-rej-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 0.85rem; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; }
.need { box-shadow: inset 3px 0 0 var(--st-dev-fg); }
label.f { display: grid; gap: 4px; font-size: 0.85rem; font-weight: 500; }
input[type=text], input[type=number], select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%; }
input[readonly] { background: var(--surface-2); color: var(--muted); }
textarea { min-height: 70px; resize: vertical; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 20px; }
.kv div > span:first-child { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.auto { font-size: 0.72rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.err { color: var(--danger); font-size: 0.85rem; }
.errbox { border: 1px solid var(--danger); border-radius: 8px; padding: 10px 14px; color: var(--danger); font-size: 0.88rem; }
.errbox ul { margin: 4px 0 0; padding-left: 18px; }
.areas { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.area { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
.area.on { border-color: var(--accent); background: var(--accent-soft); }
.files { display: grid; gap: 6px; }
.file { display: flex; gap: 10px; align-items: center; font-size: 0.88rem; background: var(--surface-2); border-radius: 6px; padding: 6px 10px; }
.file .mono { margin-left: auto; color: var(--muted); }
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .detail { grid-template-columns: 1fr; } }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.82rem; }
.flow .s { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.flow .s.done { color: var(--fg); border-color: var(--muted); }
.flow .s.cur { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.flow .arr { color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.tl li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; }
.tl li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
.tl small { color: var(--muted); display: block; }
.note { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 0.9rem; }
.q { font-family: var(--f-display); font-weight: 650; font-size: 1.05rem; }
.radio { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.radio.on { border-color: var(--accent); background: var(--accent-soft); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; }
.tile b { font-family: var(--f-display); font-size: 1.8rem; font-variant-numeric: tabular-nums; line-height: 1; }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 4px 10px; font-size: 0.88rem; }
.bar .track { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 4px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.two { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.notifs { position: absolute; right: 0; top: calc(100% + 6px); width: min(340px, 90vw); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 8px; display: grid; gap: 4px; z-index: 10; }
.notifs button { text-align: left; border: 0; background: none; font: inherit; color: var(--fg); padding: 8px; border-radius: 6px; cursor: pointer; }
.notifs button:hover { background: var(--surface-2); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; z-index: 20; max-width: 90vw; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out; } @keyframes up { from { opacity: 0; transform: translate(-50%, 8px); } } }

/* Agregados de la propuesta de Calidad: marcas de cambio, semáforo de plazos, pasos de análisis */
:root { --new-bg: #fff1c9; --new-fg: #6b4a00; --ok: #1f6943; --warn: #8a5a00; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --new-bg: #3d3110; --new-fg: #f3d27a; --ok: #93d8b0; --warn: #f0c97a; --bad: #f08a82; } }
:root[data-theme="dark"] { --new-bg: #3d3110; --new-fg: #f3d27a; --ok: #93d8b0; --warn: #f0c97a; --bad: #f08a82; }
.nw { display: inline-block; font-family: var(--f-mono); font-style: normal; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.02em; background: var(--new-bg); color: var(--new-fg); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: middle; text-transform: none; cursor: pointer; border: 0; line-height: 1.6; }
body.no-marks .nw { display: none; }
.proto-switch { display: inline-flex; gap: 6px; align-items: center; font-size: 0.82rem; }
.sem { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sem::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sem.ok::before { background: var(--ok); } .sem.warn::before { background: var(--warn); } .sem.bad::before { background: var(--bad); }
.sem.bad { color: var(--bad); font-weight: 600; }
.warnbox { border: 1px solid var(--warn); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; }
.okbox { border: 1px solid var(--ok); color: var(--ok); border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; }
.mrow { display: grid; gap: 8px; grid-template-columns: minmax(150px, 1fr) minmax(180px, 1.4fr) auto; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.mrow textarea { grid-column: 1 / -1; min-height: 56px; }
@media (max-width: 560px) { .mrow { grid-template-columns: 1fr; } }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.88rem; }
.steps li { display: flex; gap: 8px; align-items: center; }
.steps li::before { content: "○"; color: var(--muted); width: 14px; }
.steps li.done::before { content: "●"; color: var(--ok); }
.acc { display: grid; gap: 8px; grid-template-columns: minmax(0, 2fr) minmax(0, 1.2fr) 140px auto; align-items: center; }
@media (max-width: 640px) { .acc { grid-template-columns: 1fr; } }
.chg { display: grid; gap: 6px; grid-template-columns: 54px minmax(0, 1fr) auto; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.chg:last-child { border-bottom: 0; }
.chg p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.prio { font-size: 0.72rem; font-weight: 600; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.prio.Alta { background: var(--st-rej-bg); color: var(--st-rej-fg); } .prio.Media { background: var(--st-dev-bg); color: var(--st-dev-fg); } .prio.Baja { background: var(--surface-2); color: var(--muted); }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; }
.def { font-size: 0.8rem; color: var(--muted); margin: 2px 0 0 26px; }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px; display: grid; gap: 16px; max-width: 820px; }
.doc h2 { color: var(--accent); font-size: 1rem; text-transform: uppercase; letter-spacing: 0.04em; }
.doc .hd { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
label.f > .nw { justify-self: start; margin: 0; }
.detail td:first-child { min-width: 200px; }
.inline-f { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }

</style>

<script>
const AREAS = ['Producción', 'Preprensa y diseño', 'Despachos y logística', 'Ventas y servicio', 'Soporte técnico', 'Otros'];
const ESTADOS = ['Recibido', 'Devuelto', 'En análisis', 'Cerrado', 'Rechazado'];
const ABIERTOS = ['Recibido', 'Devuelto', 'En análisis'];
const USERS = { asesor: 'Andrea Molina · Asesora comercial', calidad: 'Patricio Vega · Jefe de Calidad', area: 'Jefe de Producción (ejemplo)' };
const RESP = { 'Producción': 'Jefe de Producción', 'Preprensa y diseño': 'Jefe de Preprensa', 'Despachos y logística': 'Jefe de Logística', 'Ventas y servicio': 'Jefe Comercial', 'Soporte técnico': 'Jefe de Soporte técnico', 'Otros': 'Jefe de Calidad' };
const CANALES = ['Correo electrónico', 'Llamada', 'Visita', 'WhatsApp'];
const MATERIAL = ['En bodega del cliente, sin usar', 'Parcialmente aplicado', 'Aplicado / producto en el mercado'];
const PRETENSION = ['Reposición del material', 'Nota de crédito', 'Devolución del material', 'Solo informa, no solicita compensación'];
const SOLUCION = ['Reposición', 'Nota de crédito', 'Reproceso', 'Descuento', 'Sin compensación'];
const M6 = ['Mano de obra', 'Máquina', 'Método', 'Material', 'Medición', 'Medio ambiente'];
const METODOS = ['5 porqués', 'Ishikawa (6M)', 'Otro'];
const SEVERIDAD = { 'Crítica': 'Afecta información legal o de seguridad (lote, fecha, código de barras) o detiene la línea del cliente.', 'Mayor': 'El cliente no puede usar parte del material.', 'Menor': 'Defecto estético o de servicio; el material se puede usar.' };
const CATEG = { 'Queja': 'Inconformidad con el servicio (atención, plazos, comunicación) sin defecto del producto ni pedido de compensación.', 'Reclamo': 'Producto no conforme o incumplimiento que afecta al cliente y puede requerir compensación.' };

const CAMBIOS = [
  ['C01', 'Alta', 'Ingreso', 'Fecha en que el cliente reportó y canal de recepción', 'La fecha de registro sigue siendo automática. Se agrega la fecha real en que el cliente comunicó el problema y el canal (correo, llamada, visita, WhatsApp). Si el asesor registra días después, el plazo de la política se debe medir desde el reporte del cliente.', { role: 'asesor', view: 'nuevo' }],
  ['C02', 'Alta', 'Ingreso', 'Contacto del cliente', 'Nombre y correo o teléfono de quien reporta, para que Calidad pueda pedir más información o enviar la respuesta.', { role: 'asesor', view: 'nuevo' }],
  ['C03', 'Alta', 'Ingreso', 'Control automático del plazo de la política', 'El sistema calcula los días entre la fecha de factura y la fecha de reporte. Si supera el plazo configurado, muestra una alerta al asesor y marca el ticket para Calidad. No bloquea el envío.', { role: 'asesor', view: 'nuevo' }],
  ['C04', 'Alta', 'Ingreso', 'Tipo de defecto desde un catálogo por área', 'Igual que los motivos de rechazo: opciones fijas para poder sacar Pareto. Se ajustan las áreas al alcance acordado (se quitan "Calidad", que es quien evalúa, y "Finanzas"; se agregan Producción y Preprensa). El detalle en texto libre se mantiene.', { role: 'asesor', view: 'nuevo' }],
  ['C05', 'Alta', 'Ingreso', 'Situación del material y lo que solicita el cliente', 'Estado del material (en bodega, parcialmente aplicado, en el mercado), si hay muestra física y qué pide el cliente (reposición, nota de crédito, devolución o solo informa).', { role: 'asesor', view: 'nuevo' }],
  ['C06', 'Media', 'Ingreso', 'Antecedentes del cliente y del producto', 'Al buscar la factura, el sistema muestra reclamos anteriores del mismo cliente o código de producto en los últimos 12 meses, para detectar reincidencias.', { role: 'asesor', view: 'nuevo' }],
  ['C07', 'Alta', 'Trazabilidad', 'Datos de producción de la OP visibles', 'Máquina, metros consumidos, operador, turno y lote de materia prima. El documento de análisis dice que la OP es clave para saber quién produjo y cuántos metros se usaron, pero el prototipo no lo muestra.', { role: 'calidad', view: 'detalle', ticket: 'QR-2026-0010' }],
  ['C08', 'Alta', 'Devolución', 'Corregir el ingreso completo al devolver', 'El documento de análisis dice que el ticket "regresa al paso 3". En el prototipo de Sistemas el asesor solo puede adjuntar archivos y comentar; debe poder corregir ítems, cantidades, motivos y evidencias.', { role: 'asesor', view: 'detalle', ticket: 'QR-2026-0011' }],
  ['C09', 'Media', 'Devolución', 'Motivo de devolución desde catálogo y contador', 'Motivos fijos (falta foto del lote, cantidad mal ingresada, etc.) y número de devoluciones por ticket. Permite medir la calidad del ingreso por asesor.', { role: 'calidad', view: 'catalogo', cat: 'dev' }],
  ['C10', 'Media', 'Revisión', 'Definición de queja y reclamo, y severidad', 'Las definiciones aparecen al categorizar para que todos clasifiquen igual. Se agrega severidad (Crítica, Mayor, Menor) para priorizar.', { role: 'calidad', view: 'detalle', ticket: 'QR-2026-0012' }],
  ['C11', 'Alta', 'Análisis', 'Área responsable y fecha compromiso al aceptar', 'Resuelve la pregunta abierta del paso 7 ("Calidad ¿y área responsable?"). Al aceptar, Calidad asigna el área que debe analizar y la fecha límite.', { role: 'calidad', view: 'detalle', ticket: 'QR-2026-0012' }],
  ['C12', 'Alta', 'Análisis', 'Rol de área responsable', 'El jefe del área asignada ve el ticket en su bandeja y registra la contención, la causa raíz y las acciones. Solo Calidad cierra.', { role: 'area', view: 'bandeja' }],

const usd = v => Number(v).toLocaleString('es-EC', { style: 'currency', currency: 'USD' });
const pill = e => `<span class="pill st-${e.replace(' ', '-')}">${e}</span>`;
const nw = id => `<button type="button" class="nw" data-act="chg" data-v="${id}" title="Cambio propuesto por Calidad ${id}">${id}</button>`;
const pad = x => String(x).padStart(2, '0');
function now() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
const today = () => now().slice(0, 10);
const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const addDays = (a, k) => { const d = new Date(a); d.setDate(d.getDate() + k); return d.toISOString().slice(0, 10); };
const T = id => db.tickets.find(t => t.id === id);
const factFecha = t => FACTURAS[t.items[0].factura]?.fecha;
const fueraPlazo = t => { const f = factFecha(t); return f && days(f, t.cli.fechaCli) > db.params.plazo; };
const abiertoDias = t => days(t.fecha, t.fechaCierre || today());
function sem(t) {
  const d = abiertoDias(t);
  if (!ABIERTOS.includes(t.estado)) return `<span class="sem">${d} d</span>`;
  const k = d > db.params.sla ? 'bad' : d > db.params.sla * 0.7 ? 'warn' : 'ok';
  return `<span class="sem ${k}">${d} d</span>`;
}
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3400); }
function notify(to, ticket, txt) { db.notifs.unshift({ to, ticket, txt, read: false }); }

function flow(t) {
  const main = ['Recibido', 'En análisis', 'Cerrado'];
  if (t.estado === 'Rechazado') return `<div class="flow"><span class="s done">Recibido</span><span class="arr">→</span><span class="s cur">Rechazado</span></div>`;
  if (t.estado === 'Devuelto') return `<div class="flow"><span class="s done">Recibido</span><span class="arr">→</span><span class="s cur">Devuelto al asesor</span><span class="arr">→</span><span class="s">Recibido</span></div>`;
  const k = main.indexOf(t.estado);
  return `<div class="flow">${main.map((s, i) => `<span class="s ${i < k ? 'done' : i === k ? 'cur' : ''}">${s}</span>`).join('<span class="arr">→</span>')}</div>`;
}

          <div><span>Estado del material ${nw('C05')}</span>${esc(t.sit.material)}</div><div><span>Muestra física</span>${t.sit.muestra ? 'Sí' : 'No'}</div><div><span>El cliente solicita</span>${esc(t.sit.pret)}</div>
          ${t.devs ? `<div><span>Devoluciones ${nw('C09')}</span>${t.devs}</div>` : ''}</div></section>
      <section class="panel"><h2>Ítems afectados y trazabilidad ${nw('C07')}</h2><div class="tbl-wrap"><table><thead><tr><th>Ítem</th><th>OP / Lote</th><th>Fabricación</th><th>Máquina</th><th class="num">Metros</th><th>Operador · turno</th><th>Lote materia prima</th><th class="num">Facturada</th><th class="num">Fuera de esp.</th></tr></thead><tbody>
        ${t.items.map(i => `<tr><td><span class="mono">${i.codigo}</span><br>${esc(i.desc)}<br><span class="muted mono">${i.factura}</span></td><td class="mono">${i.op}<br>${i.lote}</td><td class="mono">${i.fechaFab}</td><td>${esc(i.maquina)}</td><td class="num">${n(i.metros)}</td><td>${esc(i.operador)} · ${esc(i.turno)}</td><td class="mono">${esc(i.loteMP)}</td><td class="num">${n(i.cantFact)}</td><td class="num"><b>${n(i.afectada)}</b><br><span class="muted">${(i.afectada / i.cantFact * 100).toLocaleString('es-EC', { maximumFractionDigits: 2 })} %</span></td></tr>`).join('')}
      </tbody></table></div></section>
      <section class="panel"><h2>Motivos</h2>${t.motivos.map(m => `<div><b>${esc(m.area)} · ${esc(m.def)}</b> ${nw('C04')}<br>${esc(m.det)}</div>`).join('')}</section>
      <section class="panel"><h2>Evidencias</h2><div class="files">${t.evidencias.map(f => `<div class="file">${esc(f)}</div>`).join('')}</div></section>
      ${t.rechazo ? `<section class="panel"><h2>Rechazo</h2><div><b>${esc(t.rechazo.motivo)}</b><br>${esc(t.rechazo.obs)}</div></section>` : ''}
      ${t.asig ? `<section class="panel"><h2>Asignación ${nw('C11')}</h2><div class="kv"><div><span>Área responsable</span>${esc(t.asig.area)}</div><div><span>Responsable</span>${esc(t.asig.resp)}</div><div><span>Fecha compromiso</span><span class="mono">${t.asig.limite}</span></div></div></section>` : ''}
      ${an && t.estado !== 'En análisis' ? `<section class="panel"><h2>Análisis</h2>
        <div><b>Contención</b><br>${esc(an.cont)}</div><div><b>Causa raíz</b> <span class="muted">(${esc(an.metodo)} · ${esc(an.m6)})</span> ${nw('C13')}<br>${esc(an.causa)}</div>
        <div><b>Acciones correctivas</b> ${nw('C14')}<div class="tbl-wrap"><table><thead><tr><th>Acción</th><th>Responsable</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>${an.acciones.map(a => `<tr><td>${esc(a.d)}</td><td>${esc(a.resp)}</td><td class="mono">${a.f}</td><td>${a.ok ? 'Cumplida' : 'Pendiente'}</td></tr>`).join('')}</tbody></table></div></div></section>` : ''}
      ${t.cierre ? `<section class="panel"><h2>Cierre</h2>
        <div class="kv"><div><span>Solución al cliente ${nw('C15')}</span>${esc(t.sol.tipo)}${t.sol.cant ? ` · ${n(t.sol.cant)}` : ''}</div><div><span>Costo del reclamo</span>${usd(t.sol.costo)}</div><div><span>Fecha de cierre</span><span class="mono">${t.fechaCierre}</span></div><div><span>Verificación de eficacia ${nw('C16')}</span>${t.verif ? `${t.verif.eficaz ? 'Eficaz' : 'No eficaz'} · ${t.verif.f}` : `Programada <span class="mono">${t.cierre.verif}</span>`}</div></div>
        <div><b>Informe de cierre</b><br>${esc(t.cierre.informe)}</div>${t.verif?.obs ? `<div><b>Resultado de la verificación</b><br>${esc(t.verif.obs)}</div>` : ''}
        <div><button class="btn sm" data-act="informe">Ver informe para el cliente</button>${nw('C17')}</div></section>` : ''}
    </div>
    <div style="display:grid;gap:20px;min-width:0">
      <section class="panel">${acciones(t)}</section>
      <section class="panel"><h2>Historial</h2><ul class="tl">${t.hist.slice().reverse().map(h => `<li><div><b>${esc(h.a)}</b><small>${h.f} · ${esc(h.q)}</small>${h.n ? `<div class="note" style="margin-top:6px">${esc(h.n)}</div>` : ''}</div></li>`).join('')}</ul></section>
    </div>
  </div>`;
}

function analisisForm(t, puedeCerrar) {
  const an = t.an || (t.an = { cont: '', metodo: '', m6: '', causa: '', acciones: [] });
  const s = t.sol || (t.sol = { tipo: '', cant: '', costo: '' });
  const r = ui.rev || {};
  const ok = { cont: !!an.cont.trim(), causa: !!(an.metodo && an.m6 && an.causa.trim()), acc: an.acciones.length > 0 && an.acciones.every(a => a.d.trim() && a.resp.trim() && a.f), sol: !!s.tipo && s.costo !== '' };
  return `<h2>Análisis del reclamo</h2>
    <ul class="steps"><li class="${ok.cont ? 'done' : ''}">Contención</li><li class="${ok.causa ? 'done' : ''}">Causa raíz ${nw('C13')}</li><li class="${ok.acc ? 'done' : ''}">Acciones correctivas ${nw('C14')}</li><li class="${ok.sol ? 'done' : ''}">Solución al cliente y costo ${nw('C15')}</li><li>Cierre (solo Calidad)</li></ul>
    <label class="f">Contención inmediata<textarea id="an-cont" data-in="an-cont" placeholder="Qué se hizo con el material en bodega y en el cliente">${esc(an.cont)}</textarea></label>
    <div class="inline-f"><label class="f">Método<select id="an-metodo" data-in="an-metodo"><option value="">Seleccione…</option>${METODOS.map(x => `<option ${an.metodo === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      <label class="f">Categoría 6M<select id="an-m6" data-in="an-m6"><option value="">Seleccione…</option>${M6.map(x => `<option ${an.m6 === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
    <label class="f">Causa raíz<textarea id="an-causa" data-in="an-causa">${esc(an.causa)}</textarea></label>
    <div style="display:grid;gap:8px"><b style="font-size:.85rem">Acciones correctivas</b>
      ${an.acciones.map((a, i) => `<div class="acc"><input type="text" id="ad${i}" data-in="ac-d" data-i="${i}" value="${esc(a.d)}" placeholder="Acción"><input type="text" id="ar${i}" data-in="ac-resp" data-i="${i}" value="${esc(a.resp)}" placeholder="Responsable"><input type="text" id="acf${i}" data-in="ac-f" data-i="${i}" value="${esc(a.f)}" placeholder="AAAA-MM-DD"><label class="row" style="font-size:.82rem"><input type="checkbox" id="ao${i}" data-act="acok" data-i="${i}" ${a.ok ? 'checked' : ''}> Cumplida</label></div>`).join('')}
      <div><button class="btn sm" data-act="addacc">Agregar acción</button></div></div>
    <div class="inline-f"><label class="f">Solución al cliente<select id="so-tipo" data-in="so-tipo"><option value="">Seleccione…</option>${SOLUCION.map(x => `<option ${s.tipo === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      <label class="f">Cantidad<input type="number" id="so-cant" data-in="so-cant" value="${esc(s.cant)}" min="0"></label>
      <label class="f">Costo (USD)<input type="number" id="so-costo" data-in="so-costo" value="${esc(s.costo)}" min="0" step="0.01"></label></div>
    ${puedeCerrar ? `<hr style="border:0;border-top:1px solid var(--line);width:100%">
      <label class="f">Informe de cierre<textarea id="inf" data-in="inf">${esc(r.inf || '')}</textarea></label>
      <label class="f">Verificar eficacia el ${nw('C16')}<input type="text" id="verif" data-in="verif" value="${esc(r.verif ?? addDays(today(), 30))}" placeholder="AAAA-MM-DD"></label>
      ${r.err ? `<p class="err">${r.err}</p>` : ''}<div class="row"><button class="btn" data-act="guardar">Guardar avance</button><button class="btn pri" data-act="cerrar">Cerrar solicitud</button></div>`
    : `${r.err ? `<p class="err">${r.err}</p>` : ''}<div class="row"><button class="btn" data-act="guardar">Guardar avance</button><button class="btn pri" data-act="listo">Enviar a Calidad para cierre</button></div>`}`;
}

function acciones(t) {
  const r = ui.rev || {};
  if (ui.role === 'area') {
    if (t.estado === 'En análisis') return analisisForm(t, false);
    return `<h2>Sin acciones</h2><p class="muted" style="margin:0">Esta solicitud no está en análisis.</p>`;
  }
  if (ui.role === 'calidad') {
    if (t.estado === 'Recibido') {
      if (!r.step) return `<h2>Revisar ingreso</h2><p class="q">¿Está completa la información?</p>
        <div class="row"><button class="btn pri" data-act="rv" data-v="procede">Sí, está completa</button><button class="btn" data-act="rv" data-v="devolver">No, devolver</button></div>`;
      if (r.step === 'devolver') return `<h2>Devolver al asesor</h2>
        <label class="f">Motivo de devolución ${nw('C09')}<select id="dmot" data-in="dmot"><option value="">Seleccione…</option>${db.devolucion.filter(c => c.on).map(c => `<option ${r.dmot === c.t ? 'selected' : ''}>${esc(c.t)}</option>`).join('')}</select></label>
        <label class="f">Qué información falta<textarea id="obs" data-in="obs">${esc(r.obs || '')}</textarea></label>
        ${r.err ? `<p class="err">${r.err}</p>` : ''}<div class="row"><button class="btn" data-act="rv" data-v="">Atrás</button><button class="btn pri" data-act="devolver">Devolver y notificar</button></div>`;
      if (r.step === 'procede') return `<h2>Revisar ingreso</h2><p class="muted" style="margin:0">Información completa ✓</p><p class="q">¿Procede el requerimiento?</p>
        <div class="row"><button class="btn pri" data-act="rv" data-v="aceptar">Sí, procede</button><button class="btn dan" data-act="rv" data-v="rechazar">No procede</button><button class="btn" data-act="rv" data-v="">Atrás</button></div>`;
      if (r.step === 'aceptar') return `<h2>Categorizar y asignar</h2><div style="display:grid;gap:8px">${Object.entries(CATEG).map(([c, def]) => `<label class="radio ${r.cat === c ? 'on' : ''}" style="display:block"><input type="radio" name="cat" id="cat-${c}" data-act="cat" data-v="${c}" ${r.cat === c ? 'checked' : ''}> ${c}<div class="def">${def}</div></label>`).join('')}</div>
        <label class="f">Severidad ${nw('C10')}<select id="sev" data-in="sev"><option value="">Seleccione…</option>${Object.keys(SEVERIDAD).map(s => `<option ${r.sev === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
        ${r.sev ? `<p class="muted" style="margin:-6px 0 0;font-size:.82rem">${SEVERIDAD[r.sev]}</p>` : ''}
        <label class="f">Área responsable del análisis ${nw('C11')}<select id="aarea" data-in="aarea"><option value="">Seleccione…</option>${AREAS.map(a => `<option ${r.aarea === a ? 'selected' : ''}>${a}</option>`).join('')}</select></label>
        ${r.aarea ? `<p class="muted" style="margin:-6px 0 0;font-size:.82rem">Responsable: ${RESP[r.aarea]}. Recibirá una notificación.</p>` : ''}
        <label class="f">Fecha compromiso<input type="text" id="alim" data-in="alim" value="${esc(r.alim ?? addDays(today(), db.params.sla))}"></label>
        ${r.err ? `<p class="err">${r.err}</p>` : ''}<div class="row"><button class="btn" data-act="rv" data-v="procede">Atrás</button><button class="btn pri" data-act="aceptar">Aceptar y pasar a análisis</button></div>`;
      if (r.step === 'rechazar') return `<h2>Rechazar solicitud</h2>
        <label class="f">Motivo de rechazo (catálogo)<select id="mot" data-in="mot"><option value="">Seleccione…</option>${db.rechazo.filter(c => c.on).map(c => `<option ${r.mot === c.t ? 'selected' : ''}>${esc(c.t)}</option>`).join('')}</select></label>
        <label class="f">Observación<textarea id="obs" data-in="obs">${esc(r.obs || '')}</textarea></label>
        ${r.err ? `<p class="err">${r.err}</p>` : ''}<div class="row"><button class="btn" data-act="rv" data-v="procede">Atrás</button><button class="btn pri" data-act="rechazar">Rechazar y cerrar</button></div>`;
    }
    if (t.estado === 'En análisis') return analisisForm(t, true);
    if (t.estado === 'Devuelto') return `<h2>Esperando al asesor</h2><p class="muted" style="margin:0">La solicitud fue devuelta. Volverá a tu bandeja cuando el asesor corrija el ingreso.</p>`;
    if (t.estado === 'Cerrado' && !t.verif) {
      if (r.step === 'verif') return `<h2>Verificación de eficacia ${nw('C16')}</h2>
        <div style="display:grid;gap:8px">${[['si', 'Eficaz: el problema no se repitió'], ['no', 'No eficaz: se repitió']].map(([v, l]) => `<label class="radio ${r.ef === v ? 'on' : ''}"><input type="radio" name="ef" id="ef-${v}" data-act="ef" data-v="${v}" ${r.ef === v ? 'checked' : ''}> ${l}</label>`).join('')}</div>
        <label class="f">Evidencia de la verificación<textarea id="vobs" data-in="vobs">${esc(r.vobs || '')}</textarea></label>
        ${r.err ? `<p class="err">${r.err}</p>` : ''}<div class="row"><button class="btn" data-act="rv" data-v="">Atrás</button><button class="btn pri" data-act="verificar">Registrar verificación</button></div>`;
      return `<h2>Solicitud cerrada</h2><p class="muted" style="margin:0">Verificación de eficacia programada para el <span class="mono">${t.cierre.verif}</span>.</p>
        <div class="row"><button class="btn pri" data-act="rv" data-v="verif">Registrar verificación</button>${nw('C16')}</div>
        <div class="row"><button class="btn sm" data-act="reabrir">Reabrir (solo Jefe de Calidad)</button>${nw('C23')}</div>`;
    }
    return `<h2>Solicitud finalizada</h2><p class="muted" style="margin:0">No hay acciones pendientes.</p><div class="row"><button class="btn sm" data-act="reabrir">Reabrir (solo Jefe de Calidad)</button>${nw('C23')}</div>`;
  }
  if (t.estado === 'Devuelto') return `<h2>Corregir el ingreso ${nw('C08')}</h2>
      <div class="note"><b>Calidad solicita (${esc(t.devolucion?.motivo)}):</b><br>${esc(t.devolucion?.obs)}</div>
      <p class="muted" style="margin:0">Puede cambiar ítems, cantidades, motivos y evidencias. El ticket conserva su número e historial.</p>
      <button class="btn pri" data-act="corregir">Corregir y reenviar</button>`;
  if (t.estado === 'Recibido') return `<h2>Estado</h2><p class="muted" style="margin:0">Calidad está revisando el ingreso.</p>
    ${r.step === 'anular' ? `<label class="f">Motivo de anulación<textarea id="anobs" data-in="anobs">${esc(r.anobs || '')}</textarea></label>${r.err ? `<p class="err">${r.err}</p>` : ''}<div class="row"><button class="btn" data-act="rv" data-v="">Atrás</button><button class="btn dan" data-act="anular">Anular solicitud</button></div>`
    : `<div class="row"><button class="btn sm dan" data-act="rv" data-v="anular">Anular (ingresado por error)</button>${nw('C23')}</div>`}`;
  const msg = { 'En análisis': `Asignado a ${t.asig?.area}. Fecha compromiso: ${t.asig?.limite}.`, 'Cerrado': 'La solicitud fue cerrada.', 'Rechazado': 'La solicitud fue rechazada.' }[t.estado];
  return `<h2>Estado</h2><p class="muted" style="margin:0">${esc(msg)}</p>${t.cierre ? `<button class="btn sm" data-act="informe">Ver informe para el cliente</button>` : ''}`;
}

function vInforme() {
  const t = T(ui.ticket), an = t.an || {};
  return `<div class="row"><button class="btn sm" data-act="open" data-id="${t.id}">← Volver al ticket</button><span class="muted" style="font-size:.85rem">En el sistema real este informe se descarga en PDF con el formato ETIMET. ${nw('C17')}</span></div>
  <article class="doc">
    <div class="hd"><div><b style="font-family:var(--f-display);font-size:1.2rem">ETIMET CIA. LTDA.</b><br><span class="muted">Respuesta a ${t.categoria ? t.categoria.toLowerCase() : 'solicitud'} de cliente</span></div><div class="mono" style="text-align:right">${t.id}<br>${t.fechaCierre || today()}</div></div>
    <h2>1. Datos del cliente</h2><div class="kv"><div><span>Cliente</span>${esc(t.cliente)}</div><div><span>Atención</span>${esc(t.cli.contacto)}</div><div><span>Fecha de reporte</span>${t.cli.fechaCli}</div></div>
    <h2>2. Producto</h2><div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>Factura</th><th>Lote</th><th class="num">Cantidad reportada</th></tr></thead><tbody>${t.items.map(i => `<tr><td>${esc(i.desc)}</td><td class="mono">${i.factura}</td><td class="mono">${i.lote}</td><td class="num">${n(i.afectada)} ${i.unidad}</td></tr>`).join('')}</tbody></table></div>
    <h2>3. Descripción del problema</h2>${t.motivos.map(m => `<p style="margin:0"><b>${esc(m.def)}.</b> ${esc(m.det)}</p>`).join('')}
    <h2>4. Análisis y causa</h2><p style="margin:0">${esc(an.causa || '—')}</p>
    <h2>5. Acciones tomadas</h2><ul style="margin:0">${(an.acciones || []).map(a => `<li>${esc(a.d)}</li>`).join('')}</ul>
    <h2>6. Solución</h2><p style="margin:0">${esc(t.sol?.tipo || '—')}${t.sol?.cant ? `: ${n(t.sol.cant)} ${t.items[0].unidad}` : ''}.</p>
    <p class="muted" style="margin:0;font-size:.85rem">Elaborado por: Departamento de Calidad · ETIMET CIA. LTDA.</p>
  </article>`;
}

function vCatalogo() {
  const sub = [['rech', 'Motivos de rechazo'], ['dev', 'Motivos de devolución'], ['def', 'Tipos de defecto'], ['par', 'Parámetros']];
  const tag = { dev: nw('C09'), def: nw('C04'), par: nw('C22') };
  let body = '';
  if (ui.cat === 'par') body = `<section class="panel"><h2>Parámetros ${nw('C22')}</h2><p class="muted" style="margin:0">Valores de ejemplo. Calidad debe definir los reales antes del desarrollo.</p>
    <div class="inline-f"><label class="f">Plazo de la política de reclamos (días desde la factura)<input type="number" id="p-plazo" data-in="p-plazo" value="${db.params.plazo}" min="1"></label>
    <label class="f">Plazo de respuesta / análisis (días)<input type="number" id="p-sla" data-in="p-sla" value="${db.params.sla}" min="1"></label></div>
    <h3>Responsables por área</h3><div class="tbl-wrap"><table><thead><tr><th>Área</th><th>Responsable del análisis</th></tr></thead><tbody>${AREAS.map(a => `<tr><td>${a}</td><td>${RESP[a]}</td></tr>`).join('')}</tbody></table></div></section>`;
  else {
    const key = { rech: 'rechazo', dev: 'devolucion', def: 'defectos' }[ui.cat];
    const list = db[key];
    const uso = c => key === 'rechazo' ? db.tickets.filter(t => t.rechazo?.motivo === c.t).length : key === 'devolucion' ? db.tickets.filter(t => t.devolucion?.motivo === c.t || t.hist.some(h => h.a.includes(c.t))).length : db.tickets.filter(t => t.motivos.some(m => m.def === c.t)).length;
    body = `<section class="panel"><div class="row">${key === 'defectos' ? `<label class="f" style="min-width:180px">Área<select id="narea" data-in="narea">${AREAS.map(a => `<option ${ui.narea === a ? 'selected' : ''}>${a}</option>`).join('')}</select></label>` : ''}
      <label class="f" style="flex:1;min-width:220px">Nueva opción<input type="text" id="nm" placeholder="Escriba la nueva opción"></label><button class="btn pri" data-act="addcat" style="align-self:end">Agregar</button></div>
    ${ui.catErr ? `<p class="err">${ui.catErr}</p>` : ''}
    <div class="tbl-wrap"><table><thead><tr>${key === 'defectos' ? '<th>Área</th>' : ''}<th>Opción</th><th class="num">Solicitudes</th><th>Estado</th><th></th></tr></thead><tbody>
    ${list.map((c, i) => `<tr>${key === 'defectos' ? `<td>${c.area}</td>` : ''}<td>${esc(c.t)}</td><td class="num">${uso(c)}</td><td>${c.on ? 'Activo' : '<span class="muted">Inactivo</span>'}</td><td><button class="btn sm" data-act="togcat" data-i="${i}">${c.on ? 'Desactivar' : 'Activar'}</button></td></tr>`).join('')}
    </tbody></table></div></section>`;
  }
  return `<div class="head"><div><h1>Catálogos y parámetros</h1><p class="muted" style="margin:4px 0 0">Opciones fijas para reportería. Solo el Jefe de Calidad agrega o desactiva opciones; las opciones usadas no se borran, se desactivan.</p></div></div>
  <div class="subtabs">${sub.map(([k, l]) => `<button class="chip ${ui.cat === k ? 'on' : ''}" data-act="cat2" data-v="${k}">${l}</button>${tag[k] || ''}`).join('')}</div>${body}`;
}

function bars(rows) {
  const tot = rows.reduce((a, r) => a + r[1], 0) || 1, max = Math.max(...rows.map(r => r[1]), 1);
  return `<div class="bars">${rows.map(([l, v, lbl]) => `<div class="bar"><span>${esc(l)}</span><span class="v">${lbl ?? `${v} · ${Math.round(v / tot * 100)}%`}</span><div class="track"><div class="fill" style="width:${v / max * 100}%"></div></div></div>`).join('')}</div>`;
}
const count = (arr, f) => { const m = new Map(); arr.forEach(x => [].concat(f(x)).filter(Boolean).forEach(k => m.set(k, (m.get(k) || 0) + 1))); return [...m].sort((a, b) => b[1] - a[1]); };
function vReportes() {
  let ts = db.tickets;
  if (ui.role === 'asesor') ts = ts.filter(t => t.asesor === USERS.asesor);
  const meses = [...new Set(db.tickets.map(t => t.fecha.slice(0, 7)))].sort().reverse();
  if (ui.per !== 'Todos') ts = ts.filter(t => t.fecha.startsWith(ui.per));
  const cerr = ts.filter(t => t.estado === 'Cerrado' || t.estado === 'Rechazado');
  const prom = cerr.length ? (cerr.reduce((a, t) => a + abiertoDias(t), 0) / cerr.length).toLocaleString('es-EC', { maximumFractionDigits: 1 }) : '—';
  const costo = ts.reduce((a, t) => a + (Number(t.sol?.costo) || 0), 0);
  const venc = ts.filter(t => ABIERTOS.includes(t.estado) && abiertoDias(t) > db.params.sla).length;
  const afect = ts.reduce((a, t) => a + t.items.reduce((b, i) => b + i.afectada, 0), 0), fact = ts.reduce((a, t) => a + t.items.reduce((b, i) => b + i.cantFact, 0), 0);
  let pareto = count(ts, t => t.motivos.map(m => m.def)); let acum = 0; const totp = pareto.reduce((a, r) => a + r[1], 0) || 1;
  pareto = pareto.map(([l, v]) => { acum += v; return [l, v, `${v} · ${Math.round(acum / totp * 100)}% acum.`]; });
  return `<div class="head"><div><h1>Reportes</h1><p class="muted" style="margin:4px 0 0">${ts.length} solicitudes en el período. Se actualizan con lo que hagas en el prototipo.</p></div>
    <div class="row"><label class="f">Período ${nw('C21')}<select id="per" data-in="per"><option>Todos</option>${meses.map(m => `<option ${ui.per === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label><button class="btn" data-act="excel" style="align-self:end">Exportar a Excel</button></div></div>
  <div class="tiles">${ESTADOS.map(e => `<div class="tile"><span>${pill(e)}</span><b>${ts.filter(t => t.estado === e).length}</b></div>`).join('')}</div>
  <div class="tiles">
    <div class="tile"><span class="muted">Días promedio hasta el cierre ${nw('C21')}</span><b>${prom}</b></div>
    <div class="tile"><span class="muted">Abiertos fuera de plazo ${nw('C18')}</span><b>${venc}</b></div>
    <div class="tile"><span class="muted">Costo de reclamos ${nw('C15')}</span><b>${usd(costo)}</b></div>
    <div class="tile"><span class="muted">% reportado fuera de esp.</span><b>${fact ? (afect / fact * 100).toLocaleString('es-EC', { maximumFractionDigits: 2 }) : 0} %</b></div></div>
  <div class="two">
    <section class="panel"><h2>Pareto de tipos de defecto ${nw('C04')}</h2>${pareto.length ? bars(pareto) : '<p class="muted">Sin datos.</p>'}</section>
    <section class="panel"><h2>Por área responsable ${nw('C11')}</h2>${bars(count(ts.filter(t => t.asig), t => t.asig.area))}</section>
    <section class="panel"><h2>Por máquina ${nw('C07')}</h2>${bars(count(ts.filter(t => t.categoria), t => t.items.map(i => i.maquina)))}</section>
    <section class="panel"><h2>Causa raíz (6M) ${nw('C13')}</h2>${bars(count(ts.filter(t => t.an?.m6 && t.an.causa), t => t.an.m6))}</section>
    <section class="panel"><h2>Motivos de rechazo</h2>${bars(count(ts, t => t.rechazo?.motivo))}</section>
    <section class="panel"><h2>Devoluciones por asesor ${nw('C09')}</h2>${bars(count(ts.filter(t => t.devs), t => Array(t.devs).fill(t.asesor)))}</section>
    <section class="panel"><h2>Queja vs. reclamo</h2>${bars(['Queja', 'Reclamo'].map(c => [c, ts.filter(t => t.categoria === c).length]))}</section>
    <section class="panel"><h2>Solicitudes por cliente</h2>${bars(count(ts, t => t.cliente))}</section>
  </div>`;
}

function buscar(q) {
  q = q.trim().toUpperCase();
  draft.q = q; draft.sel = {}; draft.errors = [];
  if (FACTURAS[q]) { const f = FACTURAS[q]; draft.src = { factura: q, cliente: f.cliente, fecha: f.fecha, items: f.items }; }
  else if (OPS[q]) { const o = OPS[q], b = descOf(o.codigo); draft.src = { factura: 'Sin factura', cliente: o.cliente, fecha: o.fechaFab, items: [{ ...b, op: q, cant: o.cantFab }] }; draft.sel[0] = { on: true }; }
  else draft.src = false;
  render();
}
function validar() {
  const d = draft, e = [];
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.cli.fechaCli) || isNaN(new Date(d.cli.fechaCli))) e.push('Ingrese la fecha en que el cliente reportó (AAAA-MM-DD).');
  else if (d.cli.fechaCli > today()) e.push('La fecha de reporte no puede ser posterior a hoy.');
  if (!d.cli.canal) e.push('Seleccione el canal de recepción.');
  if (!d.cli.contacto.trim() || !d.cli.medio.trim()) e.push('Ingrese la persona que reporta y su correo o teléfono.');
  const idx = Object.keys(d.sel).filter(i => d.sel[i].on);
  if (!idx.length) e.push('Seleccione al menos un ítem afectado.');
  idx.forEach(i => { const it = d.src.items[i], s = d.sel[i];
    if (!(it.op || s.op)) e.push(`${it.codigo}: busque y seleccione la OP.`);
    const af = Number(s.af);
    if (!af || af < 1) e.push(`${it.codigo}: ingrese la cantidad fuera de especificación.`);
    else if (af > it.cant) e.push(`${it.codigo}: la cantidad no puede superar la facturada (${n(it.cant)}).`); });
  d.motivos.forEach((m, i) => { const k = d.motivos.length > 1 ? ` (motivo ${i + 1})` : '';
    if (!m.area || !m.def) e.push(`Seleccione el área y el tipo de defecto${k}.`); if (!m.det.trim()) e.push(`Escriba el detalle${k}.`); });
  if (!d.sit.material || !d.sit.muestra || !d.sit.pret) e.push('Complete la situación del material y lo que solicita el cliente.');
  if (!d.files.length) e.push('Adjunte al menos una evidencia.');
  return e;
}
function enviar() {
  draft.errors = validar();
  if (draft.errors.length) return render();
  const d = draft, f = now();
  const items = Object.keys(d.sel).filter(i => d.sel[i].on).map(i => { const it = d.src.items[i], op = it.op || d.sel[i].op;
    return { factura: d.src.factura, codigo: it.codigo, desc: it.desc, unidad: it.unidad, cantFact: it.cant, op, ...pickOp(OPS[op]), afectada: Number(d.sel[i].af) }; });
  const data = { cliente: d.src.cliente, cli: { ...d.cli }, sit: { material: d.sit.material, muestra: d.sit.muestra === 'si', pret: d.sit.pret }, items, motivos: d.motivos.map(m => ({ ...m })), evidencias: d.files.slice() };
  let id;
  if (d.editing) {
    const t = T(d.editing); id = t.id; Object.assign(t, data); t.estado = 'Recibido';
    t.hist.push({ f, q: USERS.asesor, a: 'Corrigió el ingreso y reenvió a Calidad', n: '' });
    notify('calidad', id, `${id} fue corregido y reenviado por el asesor.`);
  } else {
    id = `QR-2026-${String(db.seq++).padStart(4, '0')}`;
    db.tickets.unshift({ id, fecha: today(), asesor: USERS.asesor, estado: 'Recibido', categoria: null, devs: 0, ...data,
      hist: [{ f, q: USERS.asesor, a: 'Registró el reclamo', n: '' }, { f, q: 'Sistema', a: 'Generó el reclamo con estado RECIBIDO y notificó a Calidad', n: '' }] });
    notify('calidad', id, `Nuevo reclamo ${id} de ${d.src.cliente}.`);
  }
  const msg = d.editing ? `${id} reenviado a Calidad.` : `Reclamo ${id} registrado. Calidad recibió la notificación.`;
  draft = newDraft(); ui.view = 'detalle'; ui.ticket = id; ui.rev = null; render(); toast(msg);
}
function editarDesde(t) {
  draft = newDraft();
  const f = FACTURAS[t.items[0].factura];
  draft.editing = t.id; draft.q = t.items[0].factura;
  draft.src = { factura: t.items[0].factura, cliente: t.cliente, fecha: f.fecha, items: f.items };
  f.items.forEach((it, i) => { const x = t.items.find(y => y.codigo === it.codigo); if (x) draft.sel[i] = { on: true, op: x.op, af: x.afectada }; });
  draft.motivos = t.motivos.map(m => ({ ...m }));
  draft.files = t.evidencias.slice();
  draft.cli = { ...t.cli }; draft.sit = { material: t.sit.material, muestra: t.sit.muestra ? 'si' : 'no', pret: t.sit.pret };
}
function goChange(id) {
  const c = CAMBIOS.find(x => x[0] === id); if (!c) return;
  const g = c[5];
  if (ui.view === 'cambios' || ui.role !== g.role || ui.view !== g.view || (g.ticket && ui.ticket !== g.ticket)) {
    ui.role = g.role; ui.view = g.view; ui.rev = null; ui.bell = false;
    if (g.ticket) ui.ticket = g.ticket; if (g.cat) ui.cat = g.cat;
    if (g.view === 'nuevo') { draft = newDraft(); buscar('001-002-000043987'); }
    if (id === 'C10' || id === 'C11') ui.rev = { step: 'aceptar' };
    render(); window.scrollTo(0, 0);
  }
  toast(`${id}: ${c[3]}`);
}

function act(t, a, el) {
  const r = ui.rev || (ui.rev = {});
  switch (a) {
    case 'chg': return goChange(el.dataset.v);
    case 'marks': ui.marks = el.checked; break;
    case 'role': ui.role = el.dataset.v; ui.bell = false; ui.rev = null; if (!['detalle', 'reportes', 'cambios'].includes(ui.view) || (ui.role === 'area' && ui.view === 'reportes')) ui.view = 'bandeja'; break;
    case 'go': ui.view = el.dataset.v; ui.bell = false; ui.rev = null; if (ui.view === 'nuevo' && (!draft || draft.editing)) draft = newDraft(); break;
    case 'cancelar': draft = newDraft(); ui.view = 'bandeja'; break;
    case 'filtro': ui.filtro = el.dataset.v; break;
    case 'open': ui.view = 'detalle'; ui.ticket = el.dataset.id; ui.rev = null; break;
    case 'informe': ui.view = 'informe'; break;
    case 'bell': ui.bell = !ui.bell; break;
    case 'notif': { const x = db.notifs[+el.dataset.i]; x.read = true; ui.bell = false; ui.view = 'detalle'; ui.ticket = x.ticket; ui.rev = null; break; }
    case 'reset': db = seed(); draft = newDraft(); ui = { ...ui, view: 'bandeja', filtro: 'Todos', busca: '', farea: '', ticket: null, rev: null, bell: false }; toast('Datos de prueba reiniciados.'); break;
    case 'excel': return toast('En el sistema real descarga un .xlsx con las solicitudes filtradas.');
    case 'ej': return buscar(el.dataset.v);
    case 'buscar': return buscar(document.getElementById('q').value);
    case 'ck': { const i = el.dataset.i; draft.sel[i] = { ...(draft.sel[i] || {}), on: el.checked }; break; }
    case 'addmot2': draft.motivos.push({ area: '', def: '', det: '' }); break;
    case 'rmmot': if (draft.motivos.length > 1) draft.motivos.splice(+el.dataset.i, 1); break;
    case 'fakefile': draft.files.push(['foto_lote_rollo.jpg', 'informe_cliente.pdf', 'video_aplicacion.mp4'][draft.files.length % 3]); break;
    case 'rmfile': draft.files.splice(+el.dataset.i, 1); break;
    case 'enviar': return enviar();
    case 'corregir': editarDesde(t); ui.view = 'nuevo'; break;
    case 'rv': ui.rev = { step: el.dataset.v || null }; break;
    case 'cat': r.cat = el.dataset.v; r.err = ''; break;
    case 'ef': r.ef = el.dataset.v; r.err = ''; break;
    case 'devolver':
      if (!r.dmot || !r.obs?.trim()) { r.err = 'Seleccione el motivo de devolución e indique qué información falta.'; break; }
      t.estado = 'Devuelto'; t.devs = (t.devs || 0) + 1; t.devolucion = { motivo: r.dmot, obs: r.obs };
      t.hist.push({ f: now(), q: USERS.calidad, a: `Devolvió al asesor: ${r.dmot}`, n: r.obs }, { f: now(), q: 'Sistema', a: 'Notificó al asesor por el sistema y por correo', n: '' });
      notify('asesor', t.id, `Calidad devolvió ${t.id}: ${r.dmot.toLowerCase()}.`); ui.rev = null; render(); return toast(`${t.id} devuelto. Se notificó al asesor.`);
    case 'aceptar':
      if (!r.cat || !r.sev || !r.aarea) { r.err = 'Seleccione categoría, severidad y área responsable.'; break; }
      { const lim = r.alim ?? addDays(today(), db.params.sla);
        t.estado = 'En análisis'; t.categoria = r.cat; t.sev = r.sev; t.asig = { area: r.aarea, resp: RESP[r.aarea], limite: lim };
        t.hist.push({ f: now(), q: USERS.calidad, a: `Aceptó como ${r.cat} (severidad ${r.sev}) y asignó a ${r.aarea}`, n: `Fecha compromiso: ${lim}` }, { f: now(), q: 'Sistema', a: `Notificó a ${RESP[r.aarea]} y al asesor`, n: '' });
        notify('asesor', t.id, `${t.id} fue aceptado por Calidad y está en análisis.`);
        if (r.aarea === 'Producción') notify('area', t.id, `Se asignó ${t.id} a Producción. Fecha compromiso: ${lim}.`); }
      ui.rev = null; render(); return toast(`${t.id} aceptado como ${r.cat} y asignado a ${t.asig.area}.`);
    case 'rechazar':
      if (!r.mot || !r.obs?.trim()) { r.err = 'Seleccione el motivo del catálogo y escriba una observación.'; break; }
      t.estado = 'Rechazado'; t.fechaCierre = today(); t.rechazo = { motivo: r.mot, obs: r.obs }; t.hist.push({ f: now(), q: USERS.calidad, a: 'Rechazó la solicitud', n: `${r.mot}. ${r.obs}` });
      notify('asesor', t.id, `${t.id} fue rechazado: ${r.mot}.`); ui.rev = null; render(); return toast(`${t.id} rechazado.`);
    case 'addacc': t.an.acciones.push({ d: '', resp: '', f: '', ok: false }); break;
    case 'acok': t.an.acciones[+el.dataset.i].ok = el.checked; break;
    case 'guardar': t.hist.push({ f: now(), q: USERS[ui.role], a: 'Guardó avance del análisis', n: '' }); render(); return toast('Avance guardado.');
    case 'listo': {
      const an = t.an, s = t.sol;
      if (!an.cont.trim() || !an.metodo || !an.m6 || !an.causa.trim() || !an.acciones.length || an.acciones.some(x => !x.d.trim() || !x.resp.trim() || !x.f)) { r.err = 'Complete contención, causa raíz y al menos una acción con responsable y fecha.'; break; }
      t.hist.push({ f: now(), q: USERS.area, a: 'Completó el análisis y lo envió a Calidad para cierre', n: '' }); notify('calidad', t.id, `Producción completó el análisis de ${t.id}.`);
      ui.rev = null; render(); return toast('Análisis enviado a Calidad.'); }
    case 'cerrar': {
      const an = t.an, s = t.sol, v = r.verif ?? addDays(today(), 30);
      if (!an.cont.trim() || !an.metodo || !an.m6 || !an.causa.trim() || !an.acciones.length || an.acciones.some(x => !x.d.trim() || !x.resp.trim() || !x.f)) { r.err = 'Falta completar contención, causa raíz o acciones (con responsable y fecha).'; break; }
      if (!s.tipo || s.costo === '') { r.err = 'Indique la solución al cliente y el costo (0 si no hubo).'; break; }
      if (!r.inf?.trim()) { r.err = 'Escriba el informe de cierre.'; break; }
      t.estado = 'Cerrado'; t.fechaCierre = today(); t.sol = { tipo: s.tipo, cant: Number(s.cant) || 0, costo: Number(s.costo) || 0 }; t.cierre = { informe: r.inf, verif: v };
      t.hist.push({ f: now(), q: USERS.calidad, a: 'Registró la documentación de cierre y cerró la solicitud', n: `Verificación de eficacia programada: ${v}` });
      notify('asesor', t.id, `${t.id} fue cerrado. El informe para el cliente está disponible.`); ui.rev = null; render(); return toast(`${t.id} cerrado.`); }
    case 'verificar':
      if (!r.ef || !r.vobs?.trim()) { r.err = 'Indique el resultado y la evidencia de la verificación.'; break; }
      t.verif = { eficaz: r.ef === 'si', obs: r.vobs, f: today() }; t.hist.push({ f: now(), q: USERS.calidad, a: `Verificó la eficacia: ${r.ef === 'si' ? 'eficaz' : 'no eficaz'}`, n: r.vobs });
      ui.rev = null; render(); return toast('Verificación registrada.');
    case 'reabrir': return toast('Reabrir pide motivo y queda en el historial. Solo disponible para el Jefe de Calidad.');
    case 'anular':
      if (!r.anobs?.trim()) { r.err = 'Escriba el motivo de anulación.'; break; }
      t.estado = 'Rechazado'; t.fechaCierre = today(); t.rechazo = { motivo: 'Anulado por el asesor', obs: r.anobs }; t.hist.push({ f: now(), q: USERS.asesor, a: 'Anuló la solicitud', n: r.anobs });
      ui.rev = null; render(); return toast(`${t.id} anulado.`);
    case 'cat2': ui.cat = el.dataset.v; ui.catErr = ''; break;
    case 'addcat': { const v = document.getElementById('nm').value.trim(); const key = { rech: 'rechazo', dev: 'devolucion', def: 'defectos' }[ui.cat];
      if (!v) ui.catErr = 'Escriba la nueva opción.'; else if (db[key].some(c => c.t.toLowerCase() === v.toLowerCase())) ui.catErr = 'Esa opción ya existe.';
      else { db[key].push(key === 'defectos' ? { area: ui.narea || AREAS[0], t: v, on: true } : { t: v, on: true }); ui.catErr = ''; toast('Opción agregada al catálogo.'); } break; }
    case 'togcat': { const key = { rech: 'rechazo', dev: 'devolucion', def: 'defectos' }[ui.cat]; const c = db[key][+el.dataset.i]; c.on = !c.on; break; }
  }
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (ui.bell && !e.target.closest('.bell')) { ui.bell = false; render(); } return; }
  if (el.tagName === 'INPUT' && el.type === 'checkbox' && !['ck', 'marks', 'acok'].includes(el.dataset.act)) return;
  e.stopPropagation();
  act(T(ui.ticket), el.dataset.act, el);
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.in;
  if (!k) { if (el.id === 'q') draft.q = el.value; if (el.id === 'busca') { ui.busca = el.value; const p = el.selectionStart; render(); const b = document.getElementById('busca'); b.focus(); b.setSelectionRange(p, p); } return; }
  const r = ui.rev || (ui.rev = {}); const t = T(ui.ticket); const i = +el.dataset.i; let re = el.tagName === 'SELECT';
  if (k === 'af') draft.sel[el.dataset.i] = { ...(draft.sel[el.dataset.i] || {}), af: el.value };
  else if (k === 'op') draft.sel[el.dataset.i] = { ...(draft.sel[el.dataset.i] || {}), op: el.value };
  else if (k.startsWith('c-')) { draft.cli[k.slice(2)] = el.value; if (k === 'c-fechaCli' && /^\d{4}-\d{2}-\d{2}$/.test(el.value)) { const p = el.selectionStart; render(); const f = document.getElementById('fcli'); f.focus(); f.setSelectionRange(p, p); } }
  else if (k.startsWith('s-')) draft.sit[k.slice(2)] = el.value;
  else if (k === 'm-area') { draft.motivos[i].area = el.value; draft.motivos[i].def = ''; }
  else if (k === 'm-def') draft.motivos[i].def = el.value;
  else if (k === 'm-det') draft.motivos[i].det = el.value;
  else if (k.startsWith('an-')) t.an[k.slice(3)] = el.value;
  else if (k.startsWith('ac-')) t.an.acciones[i][k.slice(3)] = el.value;
  else if (k.startsWith('so-')) t.sol[k.slice(3)] = el.value;
  else if (k === 'farea') ui.farea = el.value;
  else if (k === 'per') ui.per = el.value;
  else if (k === 'narea') ui.narea = el.value;
  else if (k === 'p-plazo' || k === 'p-sla') { const v = Number(el.value); if (v > 0) db.params[k.slice(2)] = v; }
  else { r[k] = el.value; if (re) r.err = ''; }
  if (re) render();
});
document.addEventListener('change', e => {
  const el = e.target; if (el.type !== 'file') return;
  const names = [...el.files].map(f => f.name);
  if (el.id === 'fin') draft.files.push(...names);
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'q') buscar(e.target.value); });
draft = newDraft();
render();
