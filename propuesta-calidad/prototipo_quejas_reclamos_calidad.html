<title>Propuesta Quejas y Reclamos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* App interna: menú lateral fijo + área de trabajo; tarjetas por rol; azul corporativo ETIMET como acento */
:root {
  --bg: #f3f6fa; --surface: #ffffff; --surface-2: #eef3f8; --surface-3: #e3eaf3;
  --fg: #13233a; --muted: #5a6a7e; --line: #dbe3ee; --line-2: #c7d3e2;
  --brand: #2a6bae; --brand-ink: #ffffff; --brand-soft: #e3eef9; --brand-deep: #1d4f86;
  --side: #10284a; --side-fg: #d7e4f4; --side-muted: #8ea6c4; --side-hover: #1a3a63;
  --st-rec-bg: #e2ebfa; --st-rec-fg: #2b4f96;
  --st-dev-bg: #fdf0d5; --st-dev-fg: #7d5200;
  --st-ana-bg: #ece6fa; --st-ana-fg: #553a99;
  --st-cer-bg: #dcf2e5; --st-cer-fg: #1d6a42;
  --st-rej-bg: #fbe3e1; --st-rej-fg: #9c2d27;
  --ok: #1d7a4a; --warn: #a06400; --bad: #c0352c;
  --new-bg: #fff0c2; --new-fg: #6b4a00;
  --shadow: 0 1px 2px rgba(16, 40, 74, .06), 0 4px 14px rgba(16, 40, 74, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1522; --surface: #132033; --surface-2: #1a2a40; --surface-3: #22354f;
  --fg: #e3ecf6; --muted: #98abc2; --line: #263a55; --line-2: #33496a;
  --brand: #6aa8e8; --brand-ink: #071a30; --brand-soft: #18334f; --brand-deep: #9cc6f2;
  --side: #08111d; --side-fg: #d7e4f4; --side-muted: #7f95b1; --side-hover: #152a45;
  --st-rec-bg: #1d2c4a; --st-rec-fg: #a9c1f2; --st-dev-bg: #3a2c0f; --st-dev-fg: #f0c97a;
  --st-ana-bg: #2b2348; --st-ana-fg: #c9b8f3; --st-cer-bg: #133524; --st-cer-fg: #92d9b0;
  --st-rej-bg: #3e1d1b; --st-rej-fg: #f2a9a3; --ok: #7fd3a3; --warn: #f0c46c; --bad: #f29189;
  --new-bg: #3d3110; --new-fg: #f3d27a; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c1522; --surface: #132033; --surface-2: #1a2a40; --surface-3: #22354f;
  --fg: #e3ecf6; --muted: #98abc2; --line: #263a55; --line-2: #33496a;
  --brand: #6aa8e8; --brand-ink: #071a30; --brand-soft: #18334f; --brand-deep: #9cc6f2;
  --side: #08111d; --side-fg: #d7e4f4; --side-muted: #7f95b1; --side-hover: #152a45;
  --st-rec-bg: #1d2c4a; --st-rec-fg: #a9c1f2; --st-dev-bg: #3a2c0f; --st-dev-fg: #f0c97a;
  --st-ana-bg: #2b2348; --st-ana-fg: #c9b8f3; --st-cer-bg: #133524; --st-cer-fg: #92d9b0;
  --st-rej-bg: #3e1d1b; --st-rej-fg: #f2a9a3; --ok: #7fd3a3; --warn: #f0c46c; --bad: #f29189;
  --new-bg: #3d3110; --new-fg: #f3d27a; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.55rem; } h2 { font-size: 1.08rem; } h3 { font-size: .95rem; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-size: .85em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- estructura ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-fg); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.logo { display: flex; gap: 10px; align-items: center; padding: 2px 6px; }
.logo .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-weight: 650; }
.logo b { display: block; font-family: var(--f-display); font-size: 1rem; line-height: 1.2; }
.logo span { font-size: .72rem; color: var(--side-muted); text-transform: uppercase; letter-spacing: .07em; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; color: var(--side-fg); font: inherit; font-size: .93rem; padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; }
.nav button:hover { background: var(--side-hover); }
.nav button.on { background: var(--brand); color: #fff; font-weight: 600; }
.nav .count { margin-left: auto; background: rgba(255,255,255,.16); border-radius: 999px; font-size: .74rem; padding: 0 8px; font-weight: 600; }
.nav .count.hot { background: #f0b429; color: #3a2700; }
.side h4 { margin: 0 8px 6px; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--side-muted); font-weight: 600; }
.roles { display: grid; gap: 4px; }
.roles button { display: flex; gap: 10px; align-items: center; border: 1px solid transparent; background: none; color: var(--side-fg); font: inherit; font-size: .88rem; padding: 7px 8px; border-radius: 8px; cursor: pointer; text-align: left; }
.roles button:hover { background: var(--side-hover); }
.roles button[aria-pressed="true"] { border-color: var(--brand); background: var(--side-hover); }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; flex: none; color: #fff; }
.av.asesor { background: #2f7d6b; } .av.calidad { background: #2a6bae; } .av.area { background: #8a5a1f; }
.roles small { display: block; color: var(--side-muted); font-size: .74rem; line-height: 1.2; }
.side-foot { margin-top: auto; display: grid; gap: 10px; font-size: .84rem; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
.switch:hover { background: var(--side-hover); }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .tg { width: 34px; height: 20px; border-radius: 999px; background: var(--side-hover); border: 1px solid var(--side-muted); position: relative; flex: none; transition: background .15s; }
.switch .tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--side-fg); transition: transform .15s; }
.switch input:checked + .tg { background: #f0b429; border-color: #f0b429; }
.switch input:checked + .tg::after { transform: translateX(14px); background: #3a2700; }
.switch input:focus-visible + .tg { outline: 2px solid #f0b429; outline-offset: 2px; }
.linkbtn { border: 0; background: none; color: var(--side-muted); font: inherit; font-size: .84rem; cursor: pointer; text-align: left; padding: 4px 8px; display: flex; gap: 8px; align-items: center; }
.linkbtn:hover { color: var(--side-fg); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .in { display: flex; align-items: center; gap: 12px; padding: 12px 28px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--muted); min-width: 0; flex-wrap: wrap; }
.crumbs button { border: 0; background: none; font: inherit; color: var(--muted); cursor: pointer; padding: 0; }
.crumbs button:hover { color: var(--fg); text-decoration: underline; }
.crumbs b { color: var(--fg); font-weight: 600; }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.who .name { font-size: .85rem; line-height: 1.2; text-align: right; }
.who .name small { display: block; color: var(--muted); }
.page { padding: 26px 28px 80px; display: grid; gap: 20px; max-width: 1240px; width: 100%; }
.mobile-nav { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .mobile-nav { display: grid; gap: 8px; background: var(--side); color: var(--side-fg); padding: 10px 16px; }
  .mobile-nav .row1 { display: flex; gap: 10px; align-items: center; }
  .mobile-nav select { background: var(--side-hover); color: var(--side-fg); border-color: var(--side-hover); }
  .mobile-nav .tabs { display: flex; gap: 4px; overflow-x: auto; }
  .mobile-nav .tabs button { border: 0; background: none; color: var(--side-fg); font: inherit; font-size: .88rem; padding: 6px 10px; border-radius: 7px; white-space: nowrap; cursor: pointer; }
  .mobile-nav .tabs button.on { background: var(--brand); color: #fff; }
  .topbar .in, .page { padding-inline: 16px; }
  .who .name { display: none; }
}

/* ---------- piezas comunes ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); font: inherit; font-weight: 600; font-size: .9rem; padding: 9px 16px; border-radius: 9px; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.pri:hover { background: var(--brand-deep); border-color: var(--brand-deep); color: var(--brand-ink); }
.btn.dan { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 11px; font-size: .84rem; }
.btn.lg { padding: 12px 20px; font-size: .98rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .rcard:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-h .r { margin-left: auto; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.head p { color: var(--muted); margin-top: 4px; max-width: 70ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.plain { background: var(--surface-2); color: var(--fg); } .pill.plain::before { display: none; }
.st-Recibido { background: var(--st-rec-bg); color: var(--st-rec-fg); }
.st-Devuelto { background: var(--st-dev-bg); color: var(--st-dev-fg); }
.st-En-análisis { background: var(--st-ana-bg); color: var(--st-ana-fg); }
.st-Cerrado { background: var(--st-cer-bg); color: var(--st-cer-fg); }
.st-Rechazado { background: var(--st-rej-bg); color: var(--st-rej-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-2); background: var(--surface); color: var(--fg); font: inherit; font-size: .86rem; padding: 5px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { border-color: var(--muted); }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { opacity: .65; font-variant-numeric: tabular-nums; }
.nw { display: inline-flex; align-items: center; font-family: var(--f-mono); font-style: normal; font-size: .66rem; font-weight: 600; background: var(--new-bg); color: var(--new-fg); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: middle; cursor: pointer; border: 0; line-height: 1.65; letter-spacing: 0; text-transform: none; }
body.no-marks .nw { display: none; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
label.f { display: grid; gap: 6px; font-size: .86rem; font-weight: 600; align-content: start; }
label.f .hint { font-weight: 400; color: var(--muted); font-size: .8rem; }
label.f > .nw { justify-self: start; margin: 0; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { font: inherit; font-weight: 400; color: var(--fg); background: var(--surface); border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 12px; width: 100%; min-height: 42px; }
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
input[readonly] { background: var(--surface-2); color: var(--muted); }
textarea { min-height: 84px; resize: vertical; }
.fields { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px 20px; }
.kv > div > span:first-child { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
.auto { font-size: .68rem; color: var(--brand); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: var(--brand-soft); border-radius: 4px; padding: 1px 5px; margin-left: 4px; }
.msg { display: flex; gap: 10px; align-items: flex-start; border-radius: 10px; padding: 11px 14px; font-size: .9rem; }
.msg svg { margin-top: 2px; }
.msg.err { background: var(--st-rej-bg); color: var(--st-rej-fg); }
.msg.warn { background: var(--st-dev-bg); color: var(--st-dev-fg); }
.msg.ok { background: var(--st-cer-bg); color: var(--st-cer-fg); }
.msg.info { background: var(--brand-soft); color: var(--fg); }
.msg ul { margin: 4px 0 0; padding-left: 18px; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; display: grid; gap: 8px; justify-items: center; }

/* ---------- inicio ---------- */
.hero { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%); color: #fff; border-radius: 16px; padding: 26px 28px; display: grid; gap: 10px; }
.hero h1 { font-size: 1.8rem; color: #fff; }
.hero p { color: rgba(255,255,255,.88); max-width: 68ch; }
.hero .row .btn { background: #fff; color: #10284a; border-color: #fff; }
.hero .row .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
.tours { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.tour { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; align-content: start; box-shadow: var(--shadow); }
.tour ol { margin: 0; padding-left: 18px; color: var(--muted); font-size: .88rem; display: grid; gap: 3px; }
.tour .btn { justify-self: start; margin-top: 4px; }
.flowmap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flowmap .node { padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: .86rem; }
.flowmap .arr { color: var(--muted); }
.flowmap .side-n { display: grid; gap: 6px; }

/* ---------- bandeja ---------- */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.kpi { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; cursor: pointer; box-shadow: var(--shadow); }
.kpi:hover { border-color: var(--line-2); }
.kpi.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
.kpi span { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kpi b { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi.alert b { color: var(--bad); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { position: relative; flex: 1 1 260px; }
.search svg { position: absolute; left: 12px; top: 12px; color: var(--muted); }
.search input { padding-left: 38px; }
.list tr.click { cursor: pointer; }
.list tr.click:hover td { background: var(--surface-2); }
.list tr.need td:first-child { box-shadow: inset 4px 0 0 var(--brand); }
.turn { display: inline-block; font-size: .7rem; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 4px; padding: 0 6px; margin-top: 4px; text-transform: uppercase; letter-spacing: .04em; }
.days { display: grid; gap: 4px; min-width: 74px; font-variant-numeric: tabular-nums; font-size: .86rem; }
.days .bar { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.days .bar i { display: block; height: 100%; border-radius: 3px; background: var(--ok); }
.days.warn .bar i { background: var(--warn); } .days.bad .bar i { background: var(--bad); } .days.bad { color: var(--bad); font-weight: 600; }
.days.done .bar i { background: var(--muted); }
@media (max-width: 760px) {
  .list thead { display: none; }
  .list tr { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px; border-bottom: 1px solid var(--line); }
  .list td { border: 0; padding: 0; }
  .list td[data-l]::before { content: attr(data-l); display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .list td.hide-m { display: none; }
  .list tr.need { box-shadow: inset 4px 0 0 var(--brand); }
  .list tr.need td:first-child { box-shadow: none; }
}

/* ---------- asistente de ingreso ---------- */
.stepper { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.stepper button { flex: 1 0 auto; display: flex; align-items: center; gap: 8px; border: 0; background: none; font: inherit; font-size: .86rem; color: var(--muted); padding: 8px 10px 10px; border-bottom: 3px solid var(--line); cursor: pointer; white-space: nowrap; }
.stepper button:disabled { cursor: default; }
.stepper .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 700; background: var(--surface-3); color: var(--muted); }
.stepper button.done { color: var(--fg); border-color: var(--ok); }
.stepper button.done .dot { background: var(--ok); color: #fff; }
.stepper button.cur { color: var(--fg); font-weight: 600; border-color: var(--brand); }
.stepper button.cur .dot { background: var(--brand); color: #fff; }
.wiz-foot { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
.lookup { display: flex; gap: 10px; flex-wrap: wrap; }
.lookup input { flex: 1 1 260px; font-size: 1.05rem; min-height: 48px; }
.found { display: flex; gap: 14px; align-items: center; background: var(--st-cer-bg); color: var(--st-cer-fg); border-radius: 10px; padding: 12px 16px; }
.found b { color: var(--fg); }
.items { display: grid; gap: 10px; }
.itm { border: 1px solid var(--line-2); border-radius: 12px; padding: 14px 16px; display: grid; gap: 12px; grid-template-columns: auto minmax(0, 1fr) 170px; align-items: start; cursor: pointer; }
.itm.on { border-color: var(--brand); background: var(--brand-soft); }
.itm input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--brand); }
.itm .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .82rem; color: var(--muted); margin-top: 4px; }
.itm .qty label { font-size: .78rem; font-weight: 600; display: grid; gap: 4px; }
@media (max-width: 640px) { .itm { grid-template-columns: auto minmax(0, 1fr); } .itm .qty { grid-column: 2; } }
.opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.rcard { position: relative; border: 1px solid var(--line-2); border-radius: 10px; padding: 11px 14px; cursor: pointer; display: grid; gap: 2px; font-size: .9rem; background: var(--surface); }
.rcard:hover { border-color: var(--muted); }
.rcard input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.rcard.on { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.rcard b { font-weight: 600; }

  const counts = Object.fromEntries(ESTADOS.map(e => [e, list.filter(t => t.estado === e).length]));

/* ---------- ingreso por pasos ---------- */
function stepErrors(k) {
  const d = draft, e = [];
  if (k === 0 && !d.src) e.push('Busque una factura u OP válida para continuar.');
  if (k === 1) {
    if (!d.cli.fechaCli) e.push('Indique la fecha en que el cliente reportó.'); else if (d.cli.fechaCli > today()) e.push('La fecha de reporte no puede ser posterior a hoy.');
    if (!d.cli.canal) e.push('Elija el canal por el que llegó el reclamo.');
    if (!d.cli.contacto.trim()) e.push('Escriba quién reporta en el cliente.');
    if (!d.cli.medio.trim()) e.push('Escriba un correo o teléfono de contacto.');
  }
  if (k === 2) {
    const idx = Object.keys(d.sel).filter(i => d.sel[i].on);
    if (!idx.length) e.push('Marque al menos un ítem afectado.');
    idx.forEach(i => { const it = d.src.items[i], s = d.sel[i], af = Number(s.af);
      if (!(it.op || s.op)) e.push(`${it.codigo}: elija la OP.`);
      if (!af || af < 1) e.push(`${it.codigo}: indique cuántas ${it.unidad} están fuera de especificación.`);
      else if (af > it.cant) e.push(`${it.codigo}: no puede superar lo facturado (${n(it.cant)}).`); });
  }
  if (k === 3) d.motivos.forEach((m, i) => { const s = d.motivos.length > 1 ? ` del problema ${i + 1}` : '';
    if (!m.area) e.push(`Elija el área${s}.`); else if (!m.def) e.push(`Elija el tipo de defecto${s}.`);
    if (!m.det.trim()) e.push(`Describa el detalle${s}.`); });
  if (k === 4) {
    if (!d.sit.material) e.push('Indique en qué estado está el material.');
    if (!d.sit.muestra) e.push('Indique si hay muestra física.');
    if (!d.sit.pret) e.push('Indique qué solicita el cliente.');
    if (!d.files.length) e.push('Adjunte al menos una evidencia.');
  }
  return e;
}
const rcards = (name, opts, val, key, desc) => `<div class="opts">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<label class="rcard ${val === v ? 'on' : ''}"><input type="radio" name="${name}" data-act="pick" data-k="${key}" data-v="${esc(v)}" ${val === v ? 'checked' : ''}><b>${esc(l)}</b>${desc && desc[v] ? `<small>${esc(desc[v])}</small>` : ''}</label>`; }).join('')}</div>`;

function vNuevo() {

  const steps = `<nav class="stepper" aria-label="Pasos">${STEPS.map((l, i) => `<button data-act="wstep" data-i="${i}" class="${i === k ? 'cur' : i < d.maxStep || (i < k) ? 'done' : ''}" ${i > d.maxStep ? 'disabled' : ''}><span class="dot">${i < k || (i < d.maxStep && i !== k) ? '✓' : i + 1}</span>${l}</button>`).join('')}</nav>`;
  let body = '';
  if (k === 0) body = `<h2>¿Qué factura u orden de producción tiene el problema?</h2>
    <p class="muted">El sistema trae el cliente, los ítems, la OP y el lote. Si la factura no tiene OP, la elige en el paso 3.</p>
    <div class="lookup"><input type="search" id="q" value="${esc(d.q)}" placeholder="Ej.: 001-002-000045871 u OP-2026-0841" ${d.editing ? 'readonly' : ''} aria-label="Número de factura u OP">${d.editing ? '' : `<button class="btn pri lg" data-act="buscar">${I.search} Buscar</button>`}</div>
    ${d.editing ? '' : `<div class="row"><span class="muted small">Pruebe con:</span>${[...Object.keys(FACTURAS), 'OP-2026-0848'].map(x => `<button class="chip" data-act="ej" data-v="${x}"><span class="mono">${x}</span></button>`).join('')}</div>`}
    ${s === false ? `<div class="msg err">${I.alert}<span>No encontramos esa factura u OP. Revise el número e intente de nuevo.</span></div>` : ''}
    ${s ? `<div class="found">${I.check}<div><b>${esc(s.cliente)}</b><br><span class="small">Factura ${s.factura} · ${fmtD(s.fecha)} · ${s.items.length} ${s.items.length === 1 ? 'ítem' : 'ítems'}</span></div></div>` : ''}
    ${s ? antecedentes(s) : ''}`;
  if (k === 1) { const fd = s.fecha && d.cli.fechaCli ? days(s.fecha, d.cli.fechaCli) : null;
    body = `<h2>¿Cuándo y cómo llegó el reclamo?</h2>
    <div class="kv"><div><span>Cliente</span><b>${esc(s.cliente)}</b></div><div><span>Fecha de factura</span>${fmtD(s.fecha)}</div><div><span>Fecha de registro <em class="auto">auto</em></span>${fmtD(today())}</div></div>
    <div class="fields"><label class="f">Fecha en que el cliente reportó ${nw('C01')}<input type="date" id="fcli" data-in="c-fechaCli" value="${esc(d.cli.fechaCli)}" max="${today()}"><span class="hint">Si la registra después, use la fecha real del aviso.</span></label>
      <label class="f">Persona que reporta ${nw('C02')}<input type="text" id="contacto" data-in="c-contacto" value="${esc(d.cli.contacto)}" placeholder="Nombre y cargo"></label>
      <label class="f">Correo o teléfono ${nw('C02')}<input type="text" id="medio" data-in="c-medio" value="${esc(d.cli.medio)}" placeholder="correo@cliente.com"></label></div>
    <div class="f" style="display:grid;gap:6px"><b class="small">Canal de recepción ${nw('C01')}</b>${rcards('canal', CANALES, d.cli.canal, 'c-canal')}</div>

function bars(rows, lab) {
  if (!rows.length) return '<p class="muted small">Sin datos en este período.</p>';

}
const count = (arr, f) => { const m = new Map(); arr.forEach(x => [].concat(f(x)).filter(Boolean).forEach(k => m.set(k, (m.get(k) || 0) + 1))); return [...m].sort((a, b) => b[1] - a[1]); };

  const mname = m => { const [y, mm] = m.split('-'); return ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'][mm - 1] + ' ' + y; };

  <div class="two">

/* ---------- acciones ---------- */
function buscar(q) {
  q = q.trim().toUpperCase();
  draft.q = q; draft.sel = {}; draft.errors = []; draft.maxStep = 0;
  if (FACTURAS[q]) { const f = FACTURAS[q]; draft.src = { factura: q, cliente: f.cliente, fecha: f.fecha, items: f.items }; }
  else if (OPS[q]) { const o = OPS[q], b = descOf(o.codigo); draft.src = { factura: 'Sin factura', cliente: o.cliente, fecha: o.fechaFab, items: [{ ...b, op: q, cant: o.cantFab }] }; draft.sel[0] = { on: true }; }
  else draft.src = false;
  render();
}
function goStep(k) { draft.step = k; draft.maxStep = Math.max(draft.maxStep, k); draft.errors = []; render(); window.scrollTo(0, 0); }
function enviar() {
  for (let k = 0; k < 5; k++) { const e = stepErrors(k); if (e.length) { draft.step = k; draft.errors = e; return render(); } }
  const d = draft, f = now();
  const items = Object.keys(d.sel).filter(i => d.sel[i].on).map(i => { const it = d.src.items[i], op = it.op || d.sel[i].op;
    return { factura: d.src.factura, codigo: it.codigo, desc: it.desc, unidad: it.unidad, cantFact: it.cant, op, ...pickOp(OPS[op]), afectada: Number(d.sel[i].af) }; });
  const data = { cliente: d.src.cliente, cli: { ...d.cli }, sit: { material: d.sit.material, muestra: d.sit.muestra === 'si', pret: d.sit.pret }, items, motivos: d.motivos.map(m => ({ ...m })), evidencias: d.files.slice() };
  let id;
  if (d.editing) {
    const t = T(d.editing); id = t.id; Object.assign(t, data); t.estado = 'Recibido';
    t.hist.push({ f, q: USERS.asesor, a: 'Corrigió el ingreso y reenvió a Calidad', n: '' }); notify('calidad', id, `${id} fue corregido y reenviado por el asesor.`);
  } else {
    id = `QR-2026-${String(db.seq++).padStart(4, '0')}`;
    db.tickets.unshift({ id, fecha: today(), asesor: USERS.asesor, estado: 'Recibido', categoria: null, devs: 0, ...data,
      hist: [{ f, q: USERS.asesor, a: 'Registró el reclamo', n: '' }, { f, q: 'Sistema', a: 'Generó el reclamo con estado RECIBIDO y notificó a Calidad', n: '' }] });
    notify('calidad', id, `Nuevo reclamo ${id} de ${d.src.cliente}.`);
  }
  const msg = d.editing ? `${id} reenviado a Calidad.` : `Reclamo ${id} registrado. Calidad ya fue notificada.`;
  draft = newDraft(); ui.view = 'detalle'; ui.ticket = id; ui.rev = null; render(); window.scrollTo(0, 0); toast(msg);
}
function editarDesde(t) {
  draft = newDraft();
  const f = FACTURAS[t.items[0].factura];
  draft.editing = t.id; draft.q = t.items[0].factura;
  draft.src = { factura: t.items[0].factura, cliente: t.cliente, fecha: f.fecha, items: f.items };
  f.items.forEach((it, i) => { const x = t.items.find(y => y.codigo === it.codigo); if (x) draft.sel[i] = { on: true, op: x.op, af: x.afectada }; });
  draft.motivos = t.motivos.map(m => ({ ...m })); draft.files = t.evidencias.slice();
  draft.cli = { ...t.cli }; draft.sit = { material: t.sit.material, muestra: t.sit.muestra ? 'si' : 'no', pret: t.sit.pret };
  draft.step = 5; draft.maxStep = 5;
}
function goChange(id) {
  const c = CAMBIOS.find(x => x[0] === id); if (!c) return;
  const g = c[5];
  if (ui.view === 'cambios' || ui.view === 'inicio' || ui.role !== g.role || ui.view !== g.view || (g.ticket && ui.ticket !== g.ticket)) {
    ui.role = g.role; ui.view = g.view; ui.rev = null; ui.bell = false; ui.marks = true;
    if (g.ticket) ui.ticket = g.ticket; if (g.cat) ui.cat = g.cat;
    if (g.view === 'nuevo') { draft = newDraft(); buscar('001-002-000043987'); draft.step = ['C01', 'C02', 'C03'].includes(id) ? 1 : id === 'C05' ? 4 : id === 'C04' ? 3 : 0; draft.maxStep = draft.step; }
    if (id === 'C10' || id === 'C11') ui.rev = { step: 'aceptar' };
    render(); window.scrollTo(0, 0);
  }
  toast(`${id}: ${c[3]}`);
}
function ask(title, text, ok, run, danger) { ui.modal = { title, text, ok, run, danger }; render(); }
const anIncompleto = t => { const o = anState(t); return !(o.cont && o.causa && o.acc); };

function act(t, a, el) {
  const r = ui.rev || (ui.rev = {});
  switch (a) {
    case 'chg': return goChange(el.dataset.v);
    case 'marks': ui.marks = el.checked; break;
    case 'marks2': ui.marks = !ui.marks; break;
    case 'role': ui.role = el.dataset.v; ui.bell = false; ui.rev = null; ui.kpi = null; if (!['detalle', 'cambios', 'inicio'].includes(ui.view) || (ui.role === 'area' && ui.view === 'reportes')) ui.view = 'bandeja'; break;
    case 'tour': { ui.role = el.dataset.r; ui.rev = null; const g = el.dataset.g; if (g === 'nuevo') { ui.view = 'nuevo'; draft = newDraft(); } else { ui.view = 'detalle'; ui.ticket = g.split(':')[1]; } window.scrollTo(0, 0); break; }
    case 'go': ui.view = el.dataset.v; ui.bell = false; ui.rev = null; if (ui.view === 'nuevo' && (!draft || draft.editing)) draft = newDraft(); window.scrollTo(0, 0); break;
    case 'cancelar': draft = newDraft(); ui.view = 'bandeja'; break;
    case 'filtro': ui.filtro = el.dataset.v; break;
    case 'kpi': ui.kpi = ui.kpi === el.dataset.v || !el.dataset.v ? null : el.dataset.v; ui.filtro = 'Todos'; break;
    case 'clearf': ui.kpi = null; ui.filtro = 'Todos'; ui.busca = ''; ui.farea = ''; break;
    case 'open': ui.view = 'detalle'; ui.ticket = el.dataset.id; ui.rev = null; ui.histAll = false; window.scrollTo(0, 0); break;
    case 'informe': ui.view = 'informe'; window.scrollTo(0, 0); break;
    case 'histall': ui.histAll = !ui.histAll; break;
    case 'bell': ui.bell = !ui.bell; break;
    case 'notif': { const x = db.notifs[+el.dataset.i]; x.read = true; ui.bell = false; ui.view = 'detalle'; ui.ticket = x.ticket; ui.rev = null; break; }
    case 'reset': db = seed(); draft = newDraft(); ui = { ...ui, view: 'inicio', filtro: 'Todos', kpi: null, busca: '', farea: '', ticket: null, rev: null, bell: false, modal: null }; render(); return toast('Datos de prueba reiniciados.');
    case 'excel': return toast('En el sistema real descarga un archivo de Excel con lo filtrado.');
    case 'cprio': ui.cprio = el.dataset.v; break;
    case 'mok': { const run = ui.modal.run; ui.modal = null; return run(); }
    case 'mcancel': ui.modal = null; break;
    case 'mclose': if (el === lastEv.target) ui.modal = null; else return; break;
    /* asistente */
    case 'ej': return buscar(el.dataset.v);
    case 'buscar': return buscar(document.getElementById('q').value);
    case 'wnext': { const e = stepErrors(draft.step); if (e.length) { draft.errors = e; break; } return goStep(draft.step + 1); }
    case 'wprev': return goStep(draft.step - 1);
    case 'wstep': { const k = +el.dataset.i; if (k > draft.maxStep) return; return goStep(k); }
    case 'ck': { const i = el.dataset.i; draft.sel[i] = { ...(draft.sel[i] || {}), on: el.checked }; draft.errors = []; break; }
    case 'ckrow': { if (lastEv.target.closest('select,input,label')) return; const i = el.dataset.i; draft.sel[i] = { ...(draft.sel[i] || {}), on: !draft.sel[i]?.on }; break; }
    case 'pick': { const k = el.dataset.k, v = el.dataset.v; if (k.startsWith('c-')) draft.cli[k.slice(2)] = v; else if (k.startsWith('s-')) draft.sit[k.slice(2)] = v; else { r[k.slice(2)] = v; r.err = ''; } if (draft) draft.errors = []; break; }
    case 'addmot2': draft.motivos.push({ area: '', def: '', det: '' }); break;
    case 'rmmot': if (draft.motivos.length > 1) draft.motivos.splice(+el.dataset.i, 1); break;
    case 'fakefile': draft.files.push(['foto_lote_rollo.jpg', 'informe_cliente.pdf', 'video_aplicacion.mp4'][draft.files.length % 3]); draft.errors = []; break;
    case 'rmfile': draft.files.splice(+el.dataset.i, 1); break;
    case 'enviar': return enviar();
    case 'corregir': editarDesde(t); ui.view = 'nuevo'; window.scrollTo(0, 0); break;
    /* decisiones de Calidad */
    case 'rv': ui.rev = { step: el.dataset.v || null }; break;
    case 'devolver':
      if (!r.dmot || !r.obs?.trim()) { r.err = 'Elija el motivo e indique qué debe corregir el asesor.'; break; }
      t.estado = 'Devuelto'; t.devs = (t.devs || 0) + 1; t.devolucion = { motivo: r.dmot, obs: r.obs };
      t.hist.push({ f: now(), q: USERS.calidad, a: `Devolvió al asesor: ${r.dmot}`, n: r.obs }, { f: now(), q: 'Sistema', a: 'Notificó al asesor por el sistema y por correo', n: '' });
      notify('asesor', t.id, `Calidad devolvió ${t.id}: ${r.dmot.toLowerCase()}.`); ui.rev = null; render(); return toast(`${t.id} devuelto. Se notificó al asesor.`);
    case 'aceptar':
      if (!r.cat || !r.sev || !r.aarea) { r.err = 'Elija categoría, severidad y área responsable.'; break; }
      { const lim = r.alim ?? addDays(today(), db.params.sla);
        t.estado = 'En análisis'; t.categoria = r.cat; t.sev = r.sev; t.asig = { area: r.aarea, resp: RESP[r.aarea], limite: lim };
        t.hist.push({ f: now(), q: USERS.calidad, a: `Aceptó como ${r.cat} (severidad ${r.sev}) y asignó a ${r.aarea}`, n: `Fecha compromiso: ${lim}` }, { f: now(), q: 'Sistema', a: `Notificó a ${RESP[r.aarea]} y al asesor`, n: '' });
        notify('asesor', t.id, `${t.id} fue aceptado por Calidad y está en análisis.`);
        if (r.aarea === 'Producción') notify('area', t.id, `Se asignó ${t.id} a Producción. Fecha compromiso: ${lim}.`); }
      ui.rev = null; render(); return toast(`${t.id} aceptado y asignado a ${t.asig.area}.`);
    case 'rechazar':
      if (!r.mot || !r.obs?.trim()) { r.err = 'Elija el motivo y escriba una observación.'; break; }
      return ask(`¿Rechazar ${t.id}?`, `Motivo: ${r.mot}. La solicitud termina aquí y se notificará al asesor.`, 'Sí, rechazar', () => {
        t.estado = 'Rechazado'; t.fechaCierre = today(); t.rechazo = { motivo: r.mot, obs: r.obs }; t.hist.push({ f: now(), q: USERS.calidad, a: 'Rechazó la solicitud', n: `${r.mot}. ${r.obs}` });
        notify('asesor', t.id, `${t.id} fue rechazado: ${r.mot}.`); ui.rev = null; render(); toast(`${t.id} rechazado.`); }, true);
    /* análisis */
    case 'addacc': t.an.acciones.push({ d: '', resp: '', f: '', ok: false }); break;
    case 'rmacc': t.an.acciones.splice(+el.dataset.i, 1); break;
    case 'acok': t.an.acciones[+el.dataset.i].ok = el.checked; break;
    case 'guardar': t.hist.push({ f: now(), q: USERS[ui.role], a: 'Guardó avance del análisis', n: '' }); render(); return toast('Avance guardado.');
    case 'listo':
      if (anIncompleto(t)) { r.err = 'Complete contención, causa raíz y al menos una acción con responsable y fecha.'; break; }
      t.hist.push({ f: now(), q: USERS.area, a: 'Completó el análisis y lo envió a Calidad para cierre', n: '' }); notify('calidad', t.id, `Producción completó el análisis de ${t.id}.`);
      ui.rev = null; render(); return toast('Análisis enviado a Calidad.');
    case 'cerrar': {
      const s = t.sol, v = r.verif ?? addDays(today(), 30);
      if (anIncompleto(t) || !anState(t).sol) { r.err = 'Complete los 4 pasos del análisis.'; break; }
      if (!r.inf?.trim()) { r.err = 'Escriba el informe de cierre.'; break; }
      return ask(`¿Cerrar ${t.id}?`, `Se notificará al asesor y quedará programada la verificación de eficacia para el ${fmtD(v)}.`, 'Sí, cerrar', () => {
        t.estado = 'Cerrado'; t.fechaCierre = today(); t.sol = { tipo: s.tipo, cant: Number(s.cant) || 0, costo: Number(s.costo) || 0 }; t.cierre = { informe: r.inf, verif: v };
        t.hist.push({ f: now(), q: USERS.calidad, a: 'Registró la documentación de cierre y cerró la solicitud', n: `Verificación de eficacia programada: ${v}` });
        notify('asesor', t.id, `${t.id} fue cerrado. El informe para el cliente está disponible.`); ui.rev = null; render(); window.scrollTo(0, 0); toast(`${t.id} cerrado.`); }); }
    case 'verificar':
      if (!r.ef || !r.vobs?.trim()) { r.err = 'Indique el resultado y la evidencia.'; break; }
      t.verif = { eficaz: r.ef === 'si', obs: r.vobs, f: today() }; t.hist.push({ f: now(), q: USERS.calidad, a: `Verificó la eficacia: ${r.ef === 'si' ? 'eficaz' : 'no eficaz'}`, n: r.vobs });
      ui.rev = null; render(); return toast('Verificación registrada.');
    case 'reabrir': return toast('Reabrir pide un motivo y queda en el historial. Solo lo puede hacer el Jefe de Calidad.');
    case 'anular':
      if (!r.anobs?.trim()) { r.err = 'Escriba el motivo de anulación.'; break; }
      return ask(`¿Anular ${t.id}?`, 'La solicitud se cerrará y no llegará a análisis.', 'Sí, anular', () => {
        t.estado = 'Rechazado'; t.fechaCierre = today(); t.rechazo = { motivo: 'Anulado por el asesor', obs: r.anobs }; t.hist.push({ f: now(), q: USERS.asesor, a: 'Anuló la solicitud', n: r.anobs });
        ui.rev = null; render(); toast(`${t.id} anulado.`); }, true);
    /* catálogos */
    case 'cat2': ui.cat = el.dataset.v; ui.catErr = ''; break;
    case 'addcat': { const v = document.getElementById('nm').value.trim(), key = { rech: 'rechazo', dev: 'devolucion', def: 'defectos' }[ui.cat];
      if (!v) ui.catErr = 'Escriba la nueva opción.'; else if (db[key].some(c => c.t.toLowerCase() === v.toLowerCase())) ui.catErr = 'Esa opción ya existe.';
      else { db[key].push(key === 'defectos' ? { area: ui.narea, t: v, on: true } : { t: v, on: true }); ui.catErr = ''; render(); return toast('Opción agregada.'); } break; }
    case 'togcat': { const key = { rech: 'rechazo', dev: 'devolucion', def: 'defectos' }[ui.cat]; const c = db[key][+el.dataset.i]; c.on = !c.on; break; }
    default: return;
  }
  render();
}

let lastEv = null;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (ui.bell && !e.target.closest('.bell')) { ui.bell = false; render(); } return; }
  if (el.tagName === 'INPUT' && el.type === 'checkbox' && !['ck', 'marks', 'acok'].includes(el.dataset.act)) return;
  if (el.tagName === 'INPUT' && el.type === 'radio') return;
  lastEv = e;
  act(T(ui.ticket), el.dataset.act, el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'q') return buscar(e.target.value);
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('nw')) { e.preventDefault(); return goChange(e.target.dataset.v); }
  if (e.key === 'Enter' && e.target.matches('tr[data-act="open"]')) { ui.view = 'detalle'; ui.ticket = e.target.dataset.id; ui.rev = null; render(); }
  if (e.key === 'Escape' && (ui.modal || ui.bell)) { ui.modal = null; ui.bell = false; render(); }
});
function keepFocus(id) { const b = document.getElementById(id); if (!b) return; const p = b.selectionStart; render(); const x = document.getElementById(id); x.focus(); try { x.setSelectionRange(p, p); } catch (_) {} }
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.in;
  if (!k) { if (el.id === 'q') draft.q = el.value; if (el.id === 'busca') { ui.busca = el.value; keepFocus('busca'); } return; }
  const r = ui.rev || (ui.rev = {}), t = T(ui.ticket), i = +el.dataset.i;
  let re = el.tagName === 'SELECT' || el.type === 'date';
  if (k === 'af') { draft.sel[el.dataset.i] = { ...(draft.sel[el.dataset.i] || {}), af: el.value }; return keepFocus(el.id); }
  else if (k === 'op') draft.sel[el.dataset.i] = { ...(draft.sel[el.dataset.i] || {}), op: el.value };
  else if (k.startsWith('c-')) draft.cli[k.slice(2)] = el.value;
  else if (k.startsWith('s-')) draft.sit[k.slice(2)] = el.value;
  else if (k === 'm-area') { draft.motivos[i].area = el.value; draft.motivos[i].def = ''; }
  else if (k === 'm-def') draft.motivos[i].def = el.value;
  else if (k === 'm-det') draft.motivos[i].det = el.value;
  else if (k.startsWith('an-')) { t.an[k.slice(3)] = el.value; if (!re) return syncChecks(t); }
  else if (k.startsWith('ac-')) { t.an.acciones[i][k.slice(3)] = el.value; if (!re) return syncChecks(t); }
  else if (k.startsWith('so-')) { t.sol[k.slice(3)] = el.value; if (!re) return syncChecks(t); }
  else if (k === 'farea') ui.farea = el.value;
  else if (k === 'per') ui.per = el.value;
  else if (k === 'narea') ui.narea = el.value;
  else if (k === 'mrole') { ui.role = el.value; ui.rev = null; if (!['detalle', 'cambios', 'inicio'].includes(ui.view)) ui.view = 'bandeja'; }
  else if (k === 'p-plazo' || k === 'p-sla') { const v = Number(el.value); if (v > 0) db.params[k.slice(2)] = v; }
  else { r[k] = el.value; if (re) r.err = ''; }
  if (draft) draft.errors = re ? [] : draft.errors;
  if (re) render();
});
/* actualiza las marcas de avance sin redibujar mientras se escribe */
function syncChecks(t) {
  const ok = anState(t), done = Object.values(ok).filter(Boolean).length;
  document.querySelectorAll('.astep').forEach((s, j) => { const k = ['cont', 'causa', 'acc', 'sol'][j]; s.classList.toggle('done', ok[k]); s.querySelector('.n').textContent = ok[k] ? '✓' : j + 1; });
  document.querySelectorAll('.checklist li').forEach((li, j) => { const k = ['cont', 'causa', 'acc', 'sol'][j]; li.classList.toggle('done', ok[k]); li.querySelector('i').textContent = ok[k] ? '✓' : ''; });
  document.querySelectorAll('.next .progress i').forEach(p => p.style.width = done / 4 * 100 + '%');
  const c = document.querySelector('[data-act="cerrar"]'); if (c) c.disabled = done < 4;
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.type === 'radio' && el.dataset.act === 'pick') { act(T(ui.ticket), 'pick', el); return; }
  if (el.type !== 'file') return;
  draft.files.push(...[...el.files].map(f => f.name)); draft.errors = []; render();
});
document.addEventListener('dragover', e => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest('#drop'); if (!d) return; e.preventDefault(); draft.files.push(...[...e.dataTransfer.files].map(f => f.name)); render(); });
draft = newDraft();
render();

</script>
